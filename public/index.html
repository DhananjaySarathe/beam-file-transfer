<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121210" media="(prefers-color-scheme: dark)">
  <title>Beam</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
    <symbol id="i-tablet" viewBox="0 0 24 24"><rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
    <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="10.5" rx="1.5"/><path d="M2.5 19h19"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8.5 20.5h7M12 16v4.5"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4.5 5.5h15V16h-8L7 19.5V16H4.5z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-files" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  </svg>

  <header class="top">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="logo-bg" width="32" height="32" rx="9"/>
        <path class="logo-fg" d="M10.5 21.5 21.5 10.5M13 10.5h8.5V19"/>
      </svg>
      Beam
    </a>
    <button class="me" id="me" type="button" title="Rename this device">
      <span class="dot" id="status-dot" data-status="connecting"></span>
      <span class="me-text">
        <span class="me-label" id="status-text">Connecting</span>
        <span class="me-name" id="me-name"></span>
      </span>
      <svg class="icon sm" aria-hidden="true"><use href="#i-pencil"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button class="btn small" id="banner-action" type="button"></button>
  </div>

  <main>
    <section aria-labelledby="devices-title">
      <div class="section-head">
        <div>
          <h1 id="devices-title">Send to a device</h1>
          <p class="lede" id="lede">Looking for other devices.</p>
        </div>
      </div>
      <ul class="peers" id="peers" hidden></ul>
      <div class="join-card" id="empty">
        <div class="join" data-join></div>
      </div>
    </section>

    <section id="activity-section" aria-labelledby="activity-title" hidden>
      <div class="section-head">
        <h2 id="activity-title">Activity</h2>
        <button class="btn ghost small" id="clear-activity" type="button" hidden>Clear</button>
      </div>
      <ul class="activity" id="activity"></ul>
    </section>
  </main>

  <footer class="foot">
    Files stream from one device to the other through the computer running Beam. Nothing is stored along the way.
  </footer>

  <template id="join-template">
    <div class="qr" data-qr role="img" aria-label="QR code with the address of this page"></div>
    <div class="join-text">
      <p class="join-title">Open Beam on another device</p>
      <p data-join-help>Scan the code with a phone camera, or type this address into a browser on the same Wi-Fi or network.</p>
      <div class="url-row">
        <code data-url></code>
        <button class="btn small" type="button" data-copy>Copy link</button>
      </div>
    </div>
  </template>

  <dialog class="sheet" id="send-dialog" aria-labelledby="send-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="send-title">Send to <span id="send-peer"></span></h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <button class="dropzone" id="pick-files" type="button" autofocus>
        <svg class="icon lg" aria-hidden="true"><use href="#i-files"/></svg>
        <span class="dz-title">Choose files</span>
        <span class="dz-hint">or drop or paste them here</span>
      </button>
      <form class="text-form" id="text-form">
        <label for="send-text">Or send text or a link</label>
        <textarea id="send-text" rows="3" maxlength="100000" placeholder="Paste a link or type a note"></textarea>
        <div class="sheet-actions">
          <button class="btn primary" id="send-text-btn" type="submit" disabled>Send text</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog class="sheet" id="offer-dialog" aria-labelledby="offer-title">
    <div class="sheet-inner">
      <div class="offer-icon"><svg class="icon lg" aria-hidden="true"><use href="#i-down"/></svg></div>
      <!-- Focus lands on the title, not a button, so a stray keypress can't answer the offer. -->
      <h2 id="offer-title" tabindex="-1" autofocus></h2>
      <ul class="file-list" id="offer-files"></ul>
      <p class="muted" id="offer-more"></p>
      <div class="sheet-actions">
        <button class="btn" id="offer-decline" type="button">Decline</button>
        <button class="btn primary" id="offer-accept" type="button">Accept</button>
      </div>
    </div>
  </dialog>

  <dialog class="sheet" id="join-dialog" aria-labelledby="join-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="join-title">Add a device</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="join stacked" data-join></div>
    </div>
  </dialog>

  <dialog class="sheet" id="name-dialog" aria-labelledby="name-title">
    <form class="sheet-inner" id="name-form">
      <div class="sheet-head">
        <h2 id="name-title">Name this device</h2>
        <button class="icon-btn" type="button" data-close aria-label="Close">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <div class="text-form">
        <label for="name-input">This is the name other devices see.</label>
        <input id="name-input" type="text" maxlength="40" autocomplete="off" required>
      </div>
      <div class="sheet-actions">
        <button class="btn" type="button" data-close>Cancel</button>
        <button class="btn primary" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="file-input" multiple hidden>

  <noscript><p class="noscript">Beam needs JavaScript to find other devices and move files.</p></noscript>

  <script src="/vendor/qrcode.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
